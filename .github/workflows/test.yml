name: テスト自動実行
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  unit-test:
    name: ユニットテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 依存パッケージをインストール
        run: npm ci
      - name: ユニットテストとカバレッジを実行
        run: node node_modules/vitest/vitest.mjs run --coverage
      - name: カバレッジレポートをArtifactsに保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 依存パッケージをインストール
        run: npm ci
      - name: ESLintを実行
        run: npm run lint
      - name: Stylelintを実行
        run: npm run lint:css

  build:
    name: 配布用バンドルのビルド確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 依存パッケージをインストール
        run: npm ci
      - name: バンドルをビルド
        # js/配下がesbuildで正しくバンドルできるかを常に確認する。
        # ここが壊れると file:// でのアプリ起動自体ができなくなるため、
        # 通常のユニットテストとは別に必ずチェックする
        run: npm run build

  e2e-test:
    name: E2Eテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 依存パッケージをインストール
        run: npm ci
      - name: 配布用バンドルをビルド
        # index.html は dist/bundle.js を参照しているため、E2Eテストの前に
        # 必ずビルドしておく必要がある
        run: npm run build
      - name: Playwrightブラウザをインストール
        run: npx playwright install chromium --with-deps
      - name: E2Eテストを実行
        run: npx playwright test
      - name: テスト失敗時のスクリーンショットを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/
