name: テスト自動実行
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  unit-test:
    name: ユニットテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 依存パッケージをインストール
        run: npm ci
      - name: ユニットテストとカバレッジを実行
        run: node node_modules/vitest/vitest.mjs run --coverage
      - name: カバレッジレポートをArtifactsに保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 依存パッケージをインストール
        run: npm ci
      - name: ESLintを実行
        run: npm run lint
      - name: Stylelintを実行
        run: npm run lint:css

  dompurify-sync-check:
    name: DOMPurifyバンドルの追従確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 依存パッケージをインストール
        run: npm ci
      - name: DOMPurifyバンドルを再生成
        run: npm run sync:dompurify
      - name: 差分がないことを確認
        # package.json の dompurify を更新したのに
        # js/vendor/purify.es.js への反映（npm run sync:dompurify の実行と
        # コミット）を忘れると、ここで検知される
        run: |
          if ! git diff --exit-code -- js/vendor/purify.es.js; then
            echo "::error::js/vendor/purify.es.js が package.json の dompurify バージョンと一致していません。'npm run sync:dompurify' を実行してコミットしてください。"
            exit 1
          fi

  e2e-test:
    name: E2Eテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 依存パッケージをインストール
        run: npm ci
      - name: Playwrightブラウザをインストール
        run: npx playwright install chromium --with-deps
      - name: E2Eテストを実行
        run: npx playwright test
      - name: テスト失敗時のスクリーンショットを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/
