<!DOCTYPE html>
<html>

<head>
    <style>
        table.diff {
            border-collapse: collapse;
            width: 100%;
        }

        td {
            padding: 4px;
        }
    </style>
</head>

<body>
    <table class="diff">
        <tr>
            <th>ファイルA</th>
            <th>ファイルB</th>
        </tr>
        <tr>
            <td style="background-color: rgb(255, 160, 160);">削除された行</td>
            <td></td>
        </tr>
        <tr>
            <td style="background-color: rgb(239, 203, 5);">変更前の行</td>
            <td style="background-color: rgb(239, 203, 5);">変更後の行</td>
        </tr>
        <tr>
            <td>変更なし</td>
            <td>変更なし</td>
        </tr>
    </table>
</body>

</html>
